<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>PC-88</title>
    <meta name="viewport" content="width=1000" />
    <meta property="og:title" content="PC-88">
    <meta property="og:description" content="ブラウザ上のPC-8801">
    <meta property="og:type" content="website">
    <style>
      :root {
        color-scheme: light dark;

        /* デフォルト（ダークモード） */
        --bg-color: rgb(0, 0, 0);
        --text-color: rgb(255, 255, 255);
        --border-color: rgb(255, 255, 255);
        --hover-bg: #222222;
        --status-error-color: #ff8e8e;
        --canvas-border: #000000;
        --canvas-focus-border: #333333;
      }

      @media (prefers-color-scheme: light) {
        :root {
          --bg-color: #f5f5f7;
          --text-color: #1d1d1f;
          --border-color: #1d1d1f;
          --hover-bg: #e0e0e5;
          --status-error-color: #d32f2f;
          --canvas-border: #cccccc;
          --canvas-focus-border: #666666;
        }
      }

      @font-face {
        font-family: "Renner";
        src: url(/proxy/proxy.cgi?u=https%3A%2F%2Fkeitagames.com%2Fx68k%2FRenner.ttf) format("truetype");
        font-display: swap;
      }

      body {
        background: var(--bg-color);
        color: var(--text-color);
        font-family: "Renner", "Hiragino Sans", "Yu Gothic", sans-serif;
        margin: 0;
        padding: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }

      h1 {
        font-weight: 300;
        font-size: 25px;
      }

      header {
        scrollbar-width: none;
        -ms-overflow-style: none;
        overflow-x: auto;
        overflow-y: hidden;
        display: flex;
        flex-wrap: nowrap;
        gap: 12px;
        align-items: center;
        margin-bottom: 12px;
        padding: 0 12px;
      }

      header > * {
        flex-shrink: 0;
      }

      canvas {
        /* PC-88の画面は640x400 (8:5) */
        aspect-ratio: 8 / 5;
        width: min(100%, calc((100vh - 130px) * 1.6));
        height: auto;
        border: 1px solid var(--canvas-border);
        background: #000;
        outline: none;
        image-rendering: pixelated;
      }

      canvas:focus {
        border-color: var(--canvas-focus-border);
      }

      .row {
        padding-top: 0px;
        flex: 1;
        min-height: 0;
        justify-content: center;
        display: flex;
        gap: 12px;
        align-items: center;
        background: var(--bg-color);
      }

      #screenWrap {
        position: relative;
        display: flex;
        justify-content: center;
        width: 100%;
        line-height: 0;
      }

      button,
      .file-label {
        font-family: "Renner", "Hiragino Sans", "Yu Gothic", sans-serif;
        padding: 10px 16px;
        background: var(--bg-color);
        color: var(--text-color);
        border: 1px solid var(--border-color);
        border-radius: 0px;
        font-size: 14px;
        cursor: pointer;
        transition: background 0.2s, color 0.2s, border-color 0.2s;
      }

      button:hover,
      .file-label:hover {
        background: var(--hover-bg);
      }

      button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      .file-label {
        display: inline-block;
      }

      .file-label.drop {
        background: var(--hover-bg);
      }

      .file-input {
        display: none;
      }

      #status {
        flex: none;
        padding: 4px 12px;
        font-size: 14px;
        opacity: 0.7;
        min-height: 1.4em;
        white-space: pre-wrap;
      }

      #status.error {
        color: var(--status-error-color);
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>PC-88</h1>

      <!-- Disk Drives -->
      <label class="file-label" id="label-disk1">Drive 1 <input id="disk1Input" type="file" class="file-input" accept=".d88,.88d,.dsk,.m3u"></label>
      <label class="file-label" id="label-disk2">Drive 2 <input id="disk2Input" type="file" class="file-input" accept=".d88,.88d,.dsk,.m3u"></label>

      <!-- BIOS ROMs -->
      <label class="file-label" data-rom="N88.ROM">N88.ROM <input type="file" class="file-input"></label>
      <label class="file-label" data-rom="N88_0.ROM">N88_0.ROM <input type="file" class="file-input"></label>
      <label class="file-label" data-rom="N88_1.ROM">N88_1.ROM <input type="file" class="file-input"></label>
      <label class="file-label" data-rom="N88_2.ROM">N88_2.ROM <input type="file" class="file-input"></label>
      <label class="file-label" data-rom="N88_3.ROM">N88_3.ROM <input type="file" class="file-input"></label>
      <label class="file-label" data-rom="N88EXT0.ROM">N88EXT0.ROM <input type="file" class="file-input"></label>
      <label class="file-label" data-rom="N88EXT1.ROM">N88EXT1.ROM <input type="file" class="file-input"></label>
      <label class="file-label" data-rom="N88EXT2.ROM">N88EXT2.ROM <input type="file" class="file-input"></label>
      <label class="file-label" data-rom="N88EXT3.ROM">N88EXT3.ROM <input type="file" class="file-input"></label>
      <label class="file-label" data-rom="N80.ROM">N80.ROM <input type="file" class="file-input"></label>
      <label class="file-label" data-rom="DISK.ROM">DISK.ROM <input type="file" class="file-input"></label>
      <label class="file-label" data-rom="KANJI1.ROM">KANJI1.ROM <input type="file" class="file-input"></label>
      <label class="file-label" data-rom="KANJI2.ROM">KANJI2.ROM <input type="file" class="file-input"></label>

      <button id="start" disabled>Start</button>
    </header>

    <div class="row" id="stage">
      <div id="screenWrap"><canvas id="screen" width="640" height="400" tabindex="0"></canvas></div>
    </div>
    <div id="status">準備中…</div>

    <script>
      (function () {
        var $ = function (id) { return document.getElementById(id); };
        var statusEl = $("status");
        var startBtn = $("start");
        var canvas = $("screen");

        var ready = false;      // FSが使える状態
        var started = false;
        var loadedRoms = {};    // 読み込み済みROM名
        var disk1Path = "";
        var disk2Path = "";

        // Module.arguments は quasi88.js 読込時に参照が保持されるので、
        // 同じ配列を後から書き換えて main に渡す
        var mainArgs = [];

        function setStatus(msg, isError) {
          statusEl.textContent = msg;
          statusEl.className = isError ? "error" : "";
        }

        // このビルドでは Module.FS / Module.callMain は公開されていない。
        // 公開されている FS_createPath / FS_createDataFile / FS_unlink を使う。
        function ensureDirs() {
          Module.FS_createPath("/", "quasi88", true, true);
          Module.FS_createPath("/quasi88", "ROM", true, true);
          Module.FS_createPath("/quasi88", "DISK", true, true);
        }

        function writeFile(dir, name, data) {
          try { Module.FS_unlink(dir + "/" + name); } catch (e) {}
          Module.FS_createDataFile(dir, name, data, true, true, true);
        }

        function baseName(p, prefix) {
          return p.split("/").pop().replace(prefix, "");
        }

        function refresh() {
          if (!ready) return;
          var list = Object.keys(loadedRoms).sort();

          document.querySelectorAll("header .file-label[data-rom]").forEach(function (label) {
            var romName = label.getAttribute("data-rom");
            label.childNodes[0].nodeValue = romName + (loadedRoms[romName] ? " ✓ " : " ");
          });

          $("label-disk1").childNodes[0].nodeValue =
            disk1Path ? "Drive 1: " + baseName(disk1Path, /^drive1_/) + " ✓ " : "Drive 1 ";
          $("label-disk2").childNodes[0].nodeValue =
            disk2Path ? "Drive 2: " + baseName(disk2Path, /^drive2_/) + " ✓ " : "Drive 2 ";

          startBtn.disabled = started || list.length === 0;
          if (started) return;

          if (list.length === 0) {
            setStatus("ROMファイルを読み込んでください");
          } else {
            var msg = "ROM: " + list.join(", ");
            if (disk1Path || disk2Path) {
              msg += "\nDISK: ";
              if (disk1Path) msg += "[1] " + baseName(disk1Path, /^drive1_/) + " ";
              if (disk2Path) msg += "[2] " + baseName(disk2Path, /^drive2_/) + " ";
            }
            msg += "\nStartで起動します";
            setStatus(msg);
          }
        }

        async function saveRomFile(targetName, file) {
          if (!ready) return;
          if (started) {
            setStatus("ROMを入れ替えるにはページを再読み込みしてください", true);
            return;
          }
          try {
            var data = new Uint8Array(await file.arrayBuffer());
            writeFile("/quasi88/ROM", targetName, data);
            loadedRoms[targetName] = true;
            refresh();
          } catch (e) {
            console.error(e);
            setStatus("ROMの読み込みに失敗しました: " + (e && e.message ? e.message : e), true);
          }
        }

        async function saveDiskFile(driveNum, file) {
          if (!ready) return;
          if (started) {
            setStatus("ディスクを入れ替えるにはページを再読み込みしてください", true);
            return;
          }
          try {
            var name = "drive" + driveNum + "_" + file.name;
            var data = new Uint8Array(await file.arrayBuffer());
            writeFile("/quasi88/DISK", name, data);
            if (driveNum === 1) disk1Path = "/quasi88/DISK/" + name;
            if (driveNum === 2) disk2Path = "/quasi88/DISK/" + name;
            refresh();
          } catch (e) {
            console.error(e);
            setStatus("ディスクの読み込みに失敗しました: " + (e && e.message ? e.message : e), true);
          }
        }

        document.querySelectorAll("header .file-label[data-rom]").forEach(function (label) {
          var targetRom = label.getAttribute("data-rom");
          var input = label.querySelector("input");
          input.addEventListener("change", function () {
            if (input.files && input.files[0]) {
              saveRomFile(targetRom, input.files[0]).then(function () { input.value = ""; });
            }
          });
        });

        $("disk1Input").addEventListener("change", function () {
          if (this.files && this.files[0]) {
            saveDiskFile(1, this.files[0]).then(function () { $("disk1Input").value = ""; });
          }
        });
        $("disk2Input").addEventListener("change", function () {
          if (this.files && this.files[0]) {
            saveDiskFile(2, this.files[0]).then(function () { $("disk2Input").value = ""; });
          }
        });

        startBtn.addEventListener("click", function () {
          if (!ready || started) return;
          started = true;
          startBtn.disabled = true;
          startBtn.textContent = "Running";
          setStatus("起動中…(リセット・ROM入れ替えはページの再読み込み)");
          canvas.focus();

          mainArgs.length = 0;
          mainArgs.push("-romdir", "/quasi88/ROM");
          if (disk1Path) mainArgs.push(disk1Path);
          if (disk2Path) mainArgs.push(disk2Path);

          // preRun で止めていた起動処理を再開 → main が mainArgs で実行される
          Module.removeRunDependency("user-start");
          setTimeout(function () { setStatus(""); canvas.focus(); }, 1500);
        });

        canvas.addEventListener("click", function () { canvas.focus(); });

        window.Module = {
          canvas: canvas,
          arguments: mainArgs,
          print: function (t) { console.log(t); },
          printErr: function (t) { console.warn(t); },
          onAbort: function (what) { setStatus("エミュレータが停止しました: " + what, true); },
          // ROM/ディスクを入れるまで main の実行を止めておく
          preRun: [function () {
            Module.addRunDependency("user-start");
            ensureDirs();
            ready = true;
            refresh();
          }]
        };
      })();
    </script>
    <script src="quasi88.js"></script>
  </body>
</html>

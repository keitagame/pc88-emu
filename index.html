<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>PC-88</title>
    <meta name="viewport" content="width=1000" />
    <meta property="og:title" content="PC-88">
    <meta property="og:description" content="ブラウザ上のPC-8801">
    <meta property="og:type" content="website">
    <style>
      :root {
        color-scheme: light dark;

        /* デフォルト（ダークモード） */
        --bg-color: rgb(0, 0, 0);
        --text-color: rgb(255, 255, 255);
        --border-color: rgb(255, 255, 255);
        --hover-bg: #222222;
        --status-error-color: #ff8e8e;
        --canvas-border: #000000;
        --canvas-focus-border: #333333;
      }

      @media (prefers-color-scheme: light) {
        :root {
          --bg-color: #f5f5f7;
          --text-color: #1d1d1f;
          --border-color: #1d1d1f;
          --hover-bg: #e0e0e5;
          --status-error-color: #d32f2f;
          --canvas-border: #cccccc;
          --canvas-focus-border: #666666;
        }
      }

      @font-face {
        font-family: "Renner";
        src: url("https://keitagames.com/x68k/Renner.ttf") format("truetype");
        font-display: swap;
      }

      body {
        background: var(--bg-color);
        color: var(--text-color);
        font-family: "Renner", "Hiragino Sans", "Yu Gothic", sans-serif;
        margin: 0;
        padding: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }

      h1 {
        font-weight: 300;
        font-size: 25px;
      }

      header {
        scrollbar-width: none;
        -ms-overflow-style: none;
        overflow-x: auto;
        overflow-y: hidden;
        display: flex;
        flex-wrap: nowrap;
        gap: 12px;
        align-items: center;
        margin-bottom: 12px;
        padding: 0 12px;
      }

      header > * {
        flex-shrink: 0;
      }

      canvas {
        /* PC-88の画面は640x400 (8:5) */
        aspect-ratio: 8 / 5;
        width: min(100%, calc((100vh - 130px) * 1.6));
        height: auto;
        border: 1px solid var(--canvas-border);
        background: #000;
        outline: none;
        image-rendering: pixelated;
      }

      canvas:focus {
        border-color: var(--canvas-focus-border);
      }

      .row {
        padding-top: 0px;
        flex: 1;
        min-height: 0;
        justify-content: center;
        display: flex;
        gap: 12px;
        align-items: center;
        background: var(--bg-color);
      }

      #screenWrap {
        position: relative;
        display: flex;
        justify-content: center;
        width: 100%;
        line-height: 0;
      }

      button,
      .file-label {
        font-family: "Renner", "Hiragino Sans", "Yu Gothic", sans-serif;
        padding: 10px 16px;
        background: var(--bg-color);
        color: var(--text-color);
        border: 1px solid var(--border-color);
        border-radius: 0px;
        font-size: 14px;
        cursor: pointer;
        transition: background 0.2s, color 0.2s, border-color 0.2s;
      }

      button:hover,
      .file-label:hover {
        background: var(--hover-bg);
      }

      button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      .file-label {
        display: inline-block;
      }

      .file-label.drop {
        background: var(--hover-bg);
      }

      .file-input {
        display: none;
      }

      #status {
        flex: none;
        padding: 4px 12px;
        font-size: 14px;
        opacity: 0.7;
        min-height: 1.4em;
        white-space: pre-wrap;
      }

      #status.error {
        color: var(--status-error-color);
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>PC-88</h1>

      <label class="file-label" id="label-rom"
        title="ROMファイルを選択(複数可)。N88.ROM / N88_0〜3.ROM / N88EXT0〜3.ROM / N80.ROM / DISK.ROM / KANJI1.ROM / KANJI2.ROM / FONT.ROM など。ブラウザに保存され、次回以降は選び直し不要">
        Load ROM
        <input id="romInput" type="file" class="file-input" multiple>
      </label>
      <button id="start" disabled>Start</button>
    </header>

    <div class="row" id="stage">
      <div id="screenWrap"><canvas id="screen" width="640" height="400" tabindex="0"></canvas></div>
    </div>
    <div id="status">準備中…</div>

    <script>
      (function () {
        var $ = function (id) { return document.getElementById(id); };
        var statusEl = $("status");
        var startBtn = $("start");
        var romInput = $("romInput");
        var romLabel = $("label-rom");
        var canvas = $("screen");

        var ready = false;
        var started = false;

        function setStatus(msg, isError) {
          statusEl.textContent = msg;
          statusEl.className = isError ? "error" : "";
        }

        function romList() {
          try {
            return Module.FS.readdir("/quasi88/ROM")
              .filter(function (n) { return n !== "." && n !== ".."; })
              .sort();
          } catch (e) {
            return [];
          }
        }

        function refresh() {
          var list = romList();
          if (!ready) return;
          startBtn.disabled = started || list.length === 0;
          if (started) return;
          if (list.length === 0) {
            setStatus("ROMを読み込んでください(Load ROM、または画面へドロップ)");
          } else {
            setStatus("ROM: " + list.join(", ") + "\nStartで起動します");
          }
        }

        async function loadRoms(files) {
          if (!ready) return;
          if (started) {
            setStatus("ROMを入れ替えるにはページを再読み込みしてください", true);
            return;
          }
          var n = 0;
          for (var i = 0; i < files.length; i++) {
            var f = files[i];
            var data = new Uint8Array(await f.arrayBuffer());
            // QUASI88はファイル名の大文字小文字を区別して探すため、大文字に統一して保存
            Module.FS.writeFile("/quasi88/ROM/" + f.name.toUpperCase(), data);
            n++;
          }
          refresh();
          if (n) setStatus(statusEl.textContent + "\n(" + n + "個を保存しました)");
        }

        romInput.addEventListener("change", function () {
          loadRoms(romInput.files).then(function () { romInput.value = ""; });
        });

        // 画面・ヘッダーへのドロップでも読み込み
        ["dragenter", "dragover"].forEach(function (t) {
          document.body.addEventListener(t, function (e) {
            e.preventDefault();
            romLabel.classList.add("drop");
          });
        });
        ["dragleave", "drop"].forEach(function (t) {
          document.body.addEventListener(t, function (e) {
            e.preventDefault();
            romLabel.classList.remove("drop");
          });
        });
        document.body.addEventListener("drop", function (e) {
          if (e.dataTransfer && e.dataTransfer.files.length) loadRoms(e.dataTransfer.files);
        });

        startBtn.addEventListener("click", function () {
          if (!ready || started) return;
          started = true;
          startBtn.disabled = true;
          startBtn.textContent = "Running";
          setStatus("起動中…(リセット・ROM入れ替えはページの再読み込み)");
          canvas.focus();
          try {
            // 音声(Web Audio)はこのクリック操作で解禁される
            Module.callMain(["-romdir", "/quasi88/ROM"]);
          } catch (e) {
            if (e !== "unwind") {
              console.error(e);
              setStatus("起動に失敗しました: " + (e && e.message ? e.message : e), true);
              return;
            }
          }
          setTimeout(function () { setStatus(""); canvas.focus(); }, 1500);
        });

        canvas.addEventListener("click", function () { canvas.focus(); });

        // quasi88.js が読み込む Module(スクリプトより前に定義する)
        window.Module = {
          canvas: canvas,
          print: function (t) { console.log(t); },
          printErr: function (t) { console.warn(t); },
          onAbort: function (what) { setStatus("エミュレータが停止しました: " + what, true); },
          onRuntimeInitialized: function () {
            ready = true;
            refresh();
          }
        };
      })();
    </script>
    <script src="./quasi88.js"></script>
  </body>
</html>
